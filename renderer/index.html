<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: smcl-wall: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:" />
  <title>星启 SWUSTMCL</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <!-- 壁纸层：图片 + 四种蒙版 -->
  <div id="wallpaper" class="wallpaper" hidden>
    <div class="wallpaper-img" id="wallpaperImg"></div>
    <div class="wallpaper-img" id="wallpaperImg2"></div>
    <div class="wallpaper-mask" id="wallpaperMask"></div>
  </div>
  <script>
    // 壁纸秒显：不等任何 IPC，用上次会话缓存的地址立刻铺背景（浅色 / 深色各一份缓存）
    (function () {
      try {
        var isLight = localStorage.getItem('swustmcl.theme') === 'light';
        var src = localStorage.getItem(isLight ? 'swustmcl.wallpaper.light' : 'swustmcl.wallpaper.dark');
        if (!src) {
          var hour = new Date().getHours();
          var night = hour >= 19 || hour < 8;
          src = isLight ? 'assets/default-wallpaper-light.png' : (night ? 'assets/default-wallpaper.png' : 'assets/default-wallpaper-day.png');
        }
        var img = document.getElementById('wallpaperImg');
        var layer = document.getElementById('wallpaper');
        if (img && layer) {
          img.style.backgroundImage = 'url("' + src + '")';
          layer.hidden = false;
        }
      } catch (e) {}
    })();
  </script>

  <div id="app" class="app">
    <!-- 顶部无边框状态栏（可拖拽） -->
    <header class="topbar" id="topbar">
      <div class="topbar-title">
        <span class="topbar-star">✦</span>
        <span id="topbarViewName">首页</span>
      </div>
      <div class="topbar-drag"></div>
      <div class="topbar-status" id="topbarStatus" hidden>
        <span class="pulse-dot" id="topbarDot"></span>
        <span id="topbarStatusText">没有运行中的实例</span>
        <button class="topbar-stopbtn" id="topbarStopBtn" hidden>结束游戏</button>
      </div>
      <div class="topbar-actions">
        <button class="winbtn" id="btnMin" title="最小化" aria-label="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="winbtn" id="btnMax" title="最大化/还原" aria-label="最大化">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button class="winbtn winbtn-close" id="btnClose" title="关闭" aria-label="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- 左侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="logo">
          <div class="logo-mark"><img class="logo-img" src="assets/logo.png" alt="SWUSTMCL" /></div>
          <div class="logo-text">
            <div class="logo-name">星启</div>
            <div class="logo-sub">SWUSTMCL</div>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item active" data-view="home">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1h-4v-5H8v5H4a1 1 0 01-1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
            <span>首页</span>
          </button>
          <button class="nav-item" data-view="account">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="6.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 17c1-3.4 3.6-5 6.5-5s5.5 1.6 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span>账户</span>
          </button>
          <button class="nav-item" data-view="versions">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="3" y="3" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
            <span>版本管理</span>
          </button>
          <button class="nav-item" data-view="servers">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="3" y="4" width="14" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="11" width="14" height="5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 6.5h.1M6 13.5h.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <span>服务器</span>
          </button>
          <button class="nav-item" data-view="download">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span>下载游戏</span>
          </button>
          <button class="nav-item" data-view="content">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5a3.5 3.5 0 100 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
            <span>资源</span>
          </button>
          <button class="nav-item" data-view="packs">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M3.5 7.5L10 4l6.5 3.5v5L10 16l-6.5-3.5zM3.5 7.5L10 11l6.5-3.5M10 11v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
            <span>整合包</span>
          </button>
          <button class="nav-item" data-view="downloads">
            <span class="nav-icon"><svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v4l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <span>记录</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-icon"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.1 14.6a1.6 1.6 0 00.3 1.8l.1.1a1.9 1.9 0 11-2.7 2.7l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5v.2a1.9 1.9 0 11-3.8 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a1.9 1.9 0 11-2.7-2.7l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3.2a1.9 1.9 0 010-3.8h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a1.9 1.9 0 112.7-2.7l.1.1a1.6 1.6 0 001.8.3h.1a1.6 1.6 0 001-1.5V3.2a1.9 1.9 0 013.8 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a1.9 1.9 0 112.7 2.7l-.1.1a1.6 1.6 0 00-.3 1.8v.1a1.6 1.6 0 001.5 1h.2a1.9 1.9 0 010 3.8h-.1a1.6 1.6 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
            <span>设置</span>
          </button>
        </nav>

        <!-- 底部账号卡片 -->
        <button class="account-card" id="accountCard" title="账号">
          <span class="avatar-wrap"><canvas id="sidebarAvatar" width="8" height="8" class="avatar-canvas"></canvas></span>
          <span class="account-meta">
            <span class="account-name" id="accountName">Steve</span>
            <span class="account-mode" id="accountMode">离线</span>
          </span>
        </button>
        <div class="sidebar-resizer" id="sidebarResizer" title="拖动调整宽度（双击恢复默认）"></div>
      </aside>

      <!-- 主内容区 -->
      <main class="main" id="main">
        <div class="views" id="views">
          <section class="view active" data-view="home"></section>
          <section class="view" data-view="versions"></section>
          <section class="view" data-view="servers"></section>
          <section class="view" data-view="download"></section>
          <section class="view" data-view="downloads"></section>
          <section class="view" data-view="packs"></section>
          <section class="view" data-view="content"></section>
          <section class="view" data-view="saves"></section>
          <section class="view" data-view="account"></section>
          <section class="view" data-view="settings"></section>
        </div>
      </main>
    </div>

    <!-- 底部运行日志抽屉 -->
    <section class="logdrawer collapsed" id="logDrawer">
      <button class="logdrawer-tab" id="logTab" title="运行日志">
        <span class="logdrawer-dot" id="logDot"></span>
        运行日志
        <span class="logdrawer-arrow">︿</span>
      </button>
      <div class="logdrawer-body">
        <div class="logdrawer-tools">
          <button class="btn btn-ghost btn-xs" id="logClear">清空</button>
          <button class="btn btn-ghost btn-xs" id="logToggleWrap">自动换行</button>
        </div>
        <div class="logdrawer-lines" id="logLines" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <!-- 弹层挂载点 -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="taskCard" class="task-card" hidden>
    <div class="task-title"><span class="task-ico">⬇</span><span id="taskName">下载任务</span></div>
    <div class="progress"><div class="progress-bar" id="taskBar" style="width:0%"></div></div>
    <div class="task-meta"><span id="taskMsg"></span><span id="taskPct" class="tnum"></span></div>
  </div>

  <script src="js/loadericons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/skinview.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/versions.js"></script>
  <script src="js/pages/servers.js"></script>
  <script src="js/pages/download.js"></script>
  <script src="js/pages/downloads.js"></script>
  <script src="js/pages/packs.js"></script>
  <script src="js/pages/content.js"></script>
  <script src="js/pages/saves.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
